name: Atualizar avisos
on:
  schedule:
    - cron: '30 6 * * *'     # todos os dias, 06:30 UTC
  workflow_dispatch: {}       # permite correr à mão (botão "Run workflow")
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --prefix coletor
      - run: node coletor/coletar.mjs
      - name: Guardar avisos.json
        run: |
          git config user.name "coletor-avisos"
          git config user.email "coletor@users.noreply.github.com"
          git add avisos.json
          git diff --cached --quiet || git commit -m "Atualização diária de avisos"
          git push
